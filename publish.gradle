apply plugin: 'maven-publish'
apply from: "$gradle.ext.androidxMediaSettingsDir/missing_aar_type_workaround.gradle"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.lint:lint-gradle:31.9.1'
    }
}

repositories {
    google()
    mavenCentral()
}

afterEvaluate {
    if (gradle.ext.has('rootProjectIsAndroidXMedia3') && gradle.ext.rootProjectIsAndroidXMedia3) {
        publishing {
            repositories {
                maven {
                    name = "GitHubPackages"
                    url = uri("https://maven.pkg.github.com/FreeCastInc/FC_Android_Player_SDKs")
                    credentials {
                        username = project.findProperty("gpr.user") ?: System.getenv("GPR_USER")
                        password = project.findProperty("gpr.token") ?: System.getenv("GPR_TOKEN")
                    }
                }
            }
            publications {
                release(MavenPublication) {
                    from components.release
                    groupId = project.findProperty("gpr.groupId") as String
                    artifactId = findProperty('releaseArtifactId') ?: ''
                    version = findProperty('releaseVersion') ?: ''

                    pom {
                        name = findProperty('releaseName') ?: ''
                        description = findProperty('releaseDescription') ?: findProperty('releaseName') ?: ''
                        scm {
                            connection = 'scm:git:https://github.com/FreeCastInc/FC_Android_Player_SDKs.git'
                            url = 'https://github.com/FreeCastInc/FC_Android_Player_SDKs'
                        }
                        withXml {
                            addMissingAarTypeToXml(it)
                        }
                    }
                }
            }
        }
    }
}